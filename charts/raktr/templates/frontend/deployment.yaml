apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "raktr.fullname" . }}-frontend
  labels:
    {{- include "raktr.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  {{- with .Values.frontend.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "raktr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/frontend/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "raktr.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "raktr.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.frontend.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "raktr.podSecurityContext" . | nindent 8 }}
      initContainers:
        # The entrypoint rewrites /usr/share/nginx/html/config.js from the environment on start,
        # which the read-only root filesystem refuses, so the site is served from a writable copy.
        - name: copy-webroot
          securityContext:
            {{- include "raktr.containerSecurityContext" . | nindent 12 }}
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.imagePullPolicy }}
          command: [sh]
          args:
            - -ec
            - cp -R /usr/share/nginx/html/. /webroot/
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: webroot
              mountPath: /webroot
      containers:
        - name: frontend
          securityContext:
            {{- include "raktr.containerSecurityContext" . | nindent 12 }}
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "raktr.fullname" . }}-frontend
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.frontend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # nginx will not start without a writable pid file and temp directories.
            - name: run
              mountPath: /run
            - name: cache
              mountPath: /var/cache/nginx
            - name: webroot
              mountPath: /usr/share/nginx/html
      volumes:
        - name: run
          emptyDir:
            medium: Memory
        - name: cache
          emptyDir: {}
        - name: webroot
          emptyDir:
            sizeLimit: {{ .Values.frontend.webrootSizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
