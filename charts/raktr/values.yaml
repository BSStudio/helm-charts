---
# -- Provide a name in place of `raktr`
nameOverride: ""
# -- String to fully override `"raktr.fullname"`
fullnameOverride: ""

# -- Secrets for pulling the images from a private registry
imagePullSecrets: []
  # - name: ghcr-credentials

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# -- Optional additional annotations to add to all pods
podAnnotations: {}

# -- Optional additional labels to add to all pods
podLabels: {}

# -- Pod-level security context, merged over chart defaults (fsGroup 65532 for volume writes)
podSecurityContext: {}
  # fsGroup: 2000

# -- Container-level security context for both workloads, merged over the hardened chart defaults
# (runAsUser 65532, readOnlyRootFilesystem, capabilities drop ALL)
securityContext: {}
  # runAsUser: 65532

# -- Init containers to add to the backend deployment
initContainers: []
  # - name: wait-for-something
  #   image: busybox:latest
  #   command: ['sh', '-c', 'do-something-here']

# -- NodeSelector for all workloads
nodeSelector: {}

# -- Tolerations for all workloads
tolerations: []

# -- Affinity for all workloads
affinity: {}

backend:
  image:
    # -- The Docker repository to pull the backend image from
    repository: ghcr.io/mboldi/raktr/backend
    # -- The logic of image pulling
    imagePullPolicy: IfNotPresent
    # -- Overrides the image tag whose default is the chart appVersion
    tag: ""
  # -- Number of backend replicas (ignored when autoscaling is enabled)
  replicaCount: 1
  # -- Grace period for shutdown. Spring's graceful shutdown drains for up to 30s.
  terminationGracePeriodSeconds: 45
  # -- Deployment update strategy for the backend
  strategy: {}
    # type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 1
    #   maxUnavailable: 0
  service:
    # -- Kubernetes service type for the API
    type: ClusterIP
    # -- Port number for the API
    port: 8080
  # -- Liveness probe. The health endpoint queries the database, and the probe groups need a token.
  livenessProbe:
    tcpSocket:
      port: http
    periodSeconds: 10
    failureThreshold: 3
  # -- Readiness probe for the backend container
  readinessProbe:
    httpGet:
      path: /api/actuator/health
      port: http
    periodSeconds: 10
    failureThreshold: 3
  # -- Startup probe. Flyway migrates before the port opens.
  startupProbe:
    httpGet:
      path: /api/actuator/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 60
  # -- Container lifecycle hooks. A `preStop` sleep is charged against `terminationGracePeriodSeconds`.
  lifecycle: {}
    # preStop:
    #   exec:
    #     command: ["/bin/sleep", "10"]
  resources:
    limits:
      # -- The maximum amount of CPU the container can use
      cpu: 1000m
      # -- The maximum amount of memory the container can use
      memory: 768Mi
    requests:
      # -- Specifies the minimum amount of CPU that will be allocated to the container
      cpu: 250m
      # -- Specifies the minimum amount of memory that will be allocated to the container
      memory: 768Mi
  autoscaling:
    # -- Controls whether autoscaling is enabled for the backend deployment
    enabled: false
    # -- Minimum number of backend replicas
    minReplicas: 1
    # -- Maximum number of backend replicas
    maxReplicas: 10
    # -- Target CPU utilization percentage that triggers scaling
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  pdb:
    # -- Enable a PodDisruptionBudget for the backend. `minAvailable: 1` blocks drains at one replica.
    enabled: false
    # -- Minimum available backend pods (used when maxUnavailable is unset; defaults to 1)
    minAvailable: ""
    # -- Maximum unavailable backend pods (takes precedence over minAvailable when set)
    maxUnavailable: ""

frontend:
  image:
    # -- The Docker repository to pull the frontend image from
    repository: ghcr.io/mboldi/raktr/frontend
    # -- The logic of image pulling
    imagePullPolicy: IfNotPresent
    # -- Overrides the image tag whose default is the chart appVersion
    tag: ""
  # -- Number of frontend replicas (ignored when autoscaling is enabled)
  replicaCount: 1
  # -- Grace period for shutdown
  terminationGracePeriodSeconds: 30
  # -- Deployment update strategy for the frontend
  strategy: {}
  # -- Environment variables for the frontend, written into the browser's `config.js` at startup.
  # Keys from <https://github.com/mboldi/Raktr/blob/main/frontend/nginx/40-sentry-config.sh>.
  config:
    # -- Sentry DSN for browser error reporting. Empty disables Sentry.
    SENTRY_DSN: ""
    # -- Environment tag on the browser's Sentry events
    SENTRY_ENVIRONMENT: ""
  service:
    # -- Kubernetes service type for the web app
    type: ClusterIP
    # -- Port number for the web app
    port: 8080
  # -- Liveness probe for the frontend container
  livenessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10
    failureThreshold: 3
  # -- Readiness probe for the frontend container
  readinessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10
    failureThreshold: 3
  # -- Startup probe for the frontend container (disabled by default)
  startupProbe: {}
  # -- Size limit for the emptyDir the site is served from
  webrootSizeLimit: 64Mi
  # -- Container lifecycle hooks
  lifecycle: {}
  resources:
    limits:
      # -- The maximum amount of CPU the container can use
      cpu: 250m
      # -- The maximum amount of memory the container can use. nginx runs one worker per node CPU.
      memory: 64Mi
    requests:
      # -- Specifies the minimum amount of CPU that will be allocated to the container
      cpu: 25m
      # -- Specifies the minimum amount of memory that will be allocated to the container
      memory: 64Mi
  autoscaling:
    # -- Controls whether autoscaling is enabled for the frontend deployment
    enabled: false
    # -- Minimum number of frontend replicas
    minReplicas: 1
    # -- Maximum number of frontend replicas
    maxReplicas: 10
    # -- Target CPU utilization percentage that triggers scaling
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  pdb:
    # -- Enable a PodDisruptionBudget for the frontend. `minAvailable: 1` blocks drains at one replica.
    enabled: false
    # -- Minimum available frontend pods (used when maxUnavailable is unset; defaults to 1)
    minAvailable: ""
    # -- Maximum unavailable frontend pods (takes precedence over minAvailable when set)
    maxUnavailable: ""

ingress:
  # -- Enable an ingress resource. Each host routes `/api` to the backend and the rest to the frontend.
  enabled: false
  # -- Defines which ingress controller will implement the resource
  className: ""
  # -- Additional ingress annotations
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  # -- List of ingress hosts; the chart fixes the paths. Each host has to be a redirect URI of the
  # Authentik client the frontend image hardcodes.
  hosts: []
    #  - host: raktr.example.com
  # -- Ingress TLS configuration
  tls: []
    #  - secretName: raktr-example-com-tls
    #    hosts:
    #      - raktr.example.com

# -- Non-secret environment variables for the backend; empty values are dropped. Keys are the
# environment forms of the properties in
# <https://github.com/mboldi/Raktr/blob/main/backend/src/main/resources/application.yml>.
config:
  # -- `prod` turns off the Swagger UI and the API docs
  SPRING_PROFILES_ACTIVE: prod
  # -- JVM flags. The heap defaults to 25% of the memory limit.
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
  # JWKS the tokens are verified against. Unset, the app default matches the frontend image.
  # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: https://login.bsstudio.hu/application/o/raktr/jwks/
  # External database, with postgres.enabled false:
  # SPRING_DATASOURCE_URL: jdbc:postgresql://db.example.com:5432/raktr
  # SPRING_DATASOURCE_USERNAME: raktr
  # SENTRY_ENVIRONMENT: production

# -- Sensitive environment variables for the backend. Keys follow the same scheme as `config`.
secrets:
  # -- Sentry DSN for error reporting. Empty disables Sentry.
  SENTRY_DSN: ""
  # SPRING_DATASOURCE_PASSWORD: ""

# -- Supply the sensitive environment variables from an existing Secret instead of `secrets`. Its
# keys must be the environment variable names. SPRING_DATASOURCE_PASSWORD stays chart-managed.
existingSecret: ""

# -- Additional environment variables for the backend container. These win over `config` and `secrets`.
extraEnv: []
  # - name: MY_SETTING
  #   valueFrom:
  #     fieldRef:
  #       fieldPath: metadata.namespace

# -- Additional envFrom sources appended to the backend container
extraEnvFrom: []
  # - secretRef:
  #     name: extra-secret

# -- Additional volumes added to the backend pod
extraVolumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret

# -- Additional volume mounts added to the backend container
extraVolumeMounts: []
  # - name: foo
  #   mountPath: /etc/foo
  #   readOnly: true

postgres:
  # -- Enable the CloudPirates PostgreSQL chart.
  # Refer to <https://github.com/CloudPirates-io/helm-charts/blob/main/charts/postgres> for possible values.
  enabled: true
  auth:
    # -- Name for a custom user to create (also used as SPRING_DATASOURCE_USERNAME)
    username: raktr
    # -- Name for a custom database to create (used in SPRING_DATASOURCE_URL)
    database: raktr
    # -- Password for the custom user (also used as SPRING_DATASOURCE_PASSWORD). Must be set.
    password: ""
  resources:
    limits:
      # -- The maximum amount of CPU the container can use
      cpu: 500m
      # -- The maximum amount of memory the container can use
      memory: 512Mi
    requests:
      # -- Specifies the minimum amount of CPU that will be allocated to the container
      cpu: 250m
      # -- Specifies the minimum amount of memory that will be allocated to the container
      memory: 512Mi
  containerSecurityContext:
    # -- Run container processes as non-root user nobody
    runAsUser: 65534
    # -- Run container processes with nobody group
    runAsGroup: 65534
    seccompProfile:
      # -- Use the container runtime default seccomp profile
      type: RuntimeDefault
