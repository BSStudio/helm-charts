{{- if not .Values.oobConfig.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "website.oobConfigSecretName" . }}
  labels:
    {{- include "website.labels" . | nindent 4 }}
type: Opaque
data:
  config.json: {{ toPrettyJson .Values.oobConfig.config | b64enc | quote }}
{{- end }}
