---
# Drives `website.fullname` away from the release name, which the bundled sub-chart is named after.
# `ct` always generates a release name containing the chart name, so this needs an explicit override.

fullnameOverride: site

postgres:
  auth:
    password: secretPassword

oobConfig:
  config:
    authentik:
      clientId: ci
      clientSecret: ci-secret
