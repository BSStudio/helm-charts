---
# Ingress enabled with pathType omitted, so the chart default is what the API server validates.

postgres:
  auth:
    password: secretPassword

oobConfig:
  config:
    authentik:
      clientId: ci
      clientSecret: ci-secret

ingress:
  enabled: true
  hosts:
    - host: website.example.com
      paths:
        - path: /
